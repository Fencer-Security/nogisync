---
name: Upgrade dependencies

on:
    workflow_dispatch:
    schedule:
        - cron: 0 10 * * THU

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - name: Install prek
              uses: j178/prek-action@bdca6f102f98e2b4c7029491a53dfd366469e33d # v2.0.4
              with:
                install-only: true
            - name: Install the latest version of uv
              uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
              with:
                  version: latest

            - name: Upgrade uv versions
              run: |
                  # Avoiding potential namespace collisions with uv
                  export VERSION_OF_UV=$(uv --version | grep -Eo '^uv ([0-9]+\.[0-9]+\.[0-9]+)' | cut -d ' ' -f 2)
                  export EXISTING_VERSION_OF_UV=$(grep -Eo '^uv ([0-9]+\.[0-9]+\.[0-9]+)' .tool-versions | cut -d ' ' -f 2)

                  echo "VERSION_OF_UV: $VERSION_OF_UV"
                  echo "EXISTING_VERSION_OF_UV: $EXISTING_VERSION_OF_UV"

                  printf "### Tool versions\n" > update.log
                  printf -- "- uv: \`%s\`" "$VERSION_OF_UV" >> update.log

                  if [[ "$VERSION_OF_UV" != "$EXISTING_VERSION_OF_UV" ]]; then
                      printf " (upgrading from \`%s\`)\n\n" "$EXISTING_VERSION_OF_UV" >> update.log
                  else
                      printf "\n\n" >> update.log
                      echo "UV versions match, skipping"
                      exit 0
                  fi

                  if ! grep "uv $VERSION_OF_UV" .tool-versions ; then
                      echo "Upgrading uv version in .tool-versions"
                      sed -Ei "s/^uv.*/uv $VERSION_OF_UV/" .tool-versions
                  fi
            - name: Upgrade Python dependencies
              run: |
                  printf "### Upgraded dependencies\n\n\`\`\`\n" >> update.log
                  uv lock --upgrade 2>&1 | tee -a update.log
                  prek auto-update --freeze 2>&1 | tee -a update.log
                  printf "\`\`\`\n" >> update.log

            - name: Update pinned GitHub Action SHAs
              continue-on-error: true
              env:
                  PINACT_VERSION: 3.10.1
                  PINACT_SHA256: c5234ff3a636cda47719c73ca33a0183a5f441581455eda8a0726e5030942b69
              run: |
                  curl -fsSL -o /tmp/pinact.tar.gz \
                      "https://github.com/suzuki-shunsuke/pinact/releases/download/v${PINACT_VERSION}/pinact_linux_amd64.tar.gz"
                  echo "${PINACT_SHA256}  /tmp/pinact.tar.gz" | sha256sum -c -
                  tar -xzf /tmp/pinact.tar.gz -C /tmp pinact
                  /tmp/pinact run --update >/tmp/pinact.out 2>&1 || true
                  printf "\n### GitHub Actions SHAs\n\n" >> update.log
                  if grep -q '^::notice' /tmp/pinact.out; then
                      printf "| File | Updated |\n|---|---|\n" >> update.log
                      sed -nE 's|^::notice file=([^,]+),line=[0-9]+,title=[^:]+::[[:space:]]*(.*)$|\1\x01\2|p' \
                          /tmp/pinact.out \
                          | awk -F$'\x01' '{printf "| `%s` | `%s` |\n", $1, $2}' \
                          >> update.log
                  else
                      printf "_No action SHA updates needed._\n" >> update.log
                  fi

            - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              id: generate-token
              with:
                  app-id: ${{ secrets.APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}

            - name: Create Pull Request
              uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
              with:
                  token: ${{ steps.generate-token.outputs.token }} # https://github.com/peter-evans/create-pull-request/blob/main/docs/concepts-guidelines.md#authenticating-with-github-app-generated-tokens
                  commit-message: Upgrade dependencies
                  branch: bot/upgrade-dependencies
                  delete-branch: true
                  sign-commits: true
                  title: "chore: Weekly dependency upgrades"
                  body-path: update.log
                  add-paths: |
                      uv.lock
                      .pre-commit-config.yaml
                      .tool-versions
                      .github/workflows/*.yml
                  team-reviewers: |
                      engineering
