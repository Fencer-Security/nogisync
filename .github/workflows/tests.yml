---
name: Run Lint & Tests
on:
    pull_request:
    push:
        branches:
          - main

permissions:
    contents: read

jobs:
    code-style:
        name: Check code style
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
          - name: Set up Python 3.14
            uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
            with:
                python-version: 3.14
                cache: pip
                cache-dependency-path: |
                    uv.lock
          - name: Run pre-commit hooks
            uses: j178/prek-action@bdca6f102f98e2b4c7029491a53dfd366469e33d # v2.0.4
    mypy:
        name: Run mypy
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
          - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
          - name: Install uv
            uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
            with:
                enable-cache: true
                version: latest
          - name: Install Dependencies
            run: |
                uv sync --locked
          - name: Run mypy
            run: |
                uv run mypy .
    tests:
        name: Run tests
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            pull-requests: write
            contents: read
        steps:
          - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
          - name: Install uv
            uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
            with:
                enable-cache: true
                version: latest
          - name: Install Python Dependencies
            run: |
                uv sync --locked
          - name: Run Tests
            run: uv run pytest
          - name: Process Coverage Report
            run: |
                uv run coverage html --skip-covered --skip-empty

                # Report and write to summary.
                uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

                # Generate a comment for the PR
                echo -e "## Code Coverage Report\n<details>\n  <summary>Coverage Report</summary>\n" > comment.md
                cat $GITHUB_STEP_SUMMARY | sed -e 's/^/  /' >> comment.md
                echo -e "\n</details>" >> comment.md
                echo -e "\nTotal Coverage: " >> comment.md
                cat $GITHUB_STEP_SUMMARY | tail -3 | head -1 | awk -F '|' '{print $7}' | sed -e 's/ //' >> comment.md

                # Report again and fail if under 80%.
                uv run coverage report --fail-under=80
          - name: Comment on PR
            uses: Fencer-Security/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b
            if: ${{ github.event_name == 'pull_request' }}
            with:
                file-path: comment.md
                comment-tag: coverage-comment
          - name: Upload HTML report if check failed.
            uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
            if: ${{ failure() }}
            with:
                name: html-report
                path: htmlcov
