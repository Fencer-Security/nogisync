---
name: Run Lint & Tests
on:
    pull_request:
    push:
        branches:
          - main

permissions:
    contents: read

jobs:
    code-style:
        name: Check code style
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - name: Set up Python 3.14
            uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
            with:
                python-version: 3.14
                cache: pip
                cache-dependency-path: |
                    uv.lock
          - name: Run pre-commit hooks
            uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
    mypy:
        name: Run mypy
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - name: Install uv
            uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
            with:
                enable-cache: true
                version: latest
          - name: Install Dependencies
            run: |
                uv sync --locked
          - name: Run mypy
            run: |
                uv run mypy .
    tests:
        name: Run tests
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            pull-requests: write
            contents: read
        steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - name: Install uv
            uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
            with:
                enable-cache: true
                version: latest
          - name: Install Python Dependencies
            run: |
                uv sync --locked
          - name: Run Tests
            run: uv run pytest
          - name: Process Coverage Report
            run: |
                uv run coverage html --skip-covered --skip-empty

                # Report and write to summary.
                uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

                # Generate a comment for the PR
                echo -e "## Code Coverage Report\n<details>\n  <summary>Coverage Report</summary>\n" > comment.md
                cat $GITHUB_STEP_SUMMARY | sed -e 's/^/  /' >> comment.md
                echo -e "\n</details>" >> comment.md
                echo -e "\nTotal Coverage: " >> comment.md
                cat $GITHUB_STEP_SUMMARY | tail -3 | head -1 | awk -F '|' '{print $7}' | sed -e 's/ //' >> comment.md

                # Report again and fail if under 80%.
                uv run coverage report --fail-under=80
          - name: Comment on PR
            uses: Fencer-Security/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b
            if: ${{ github.event_name == 'pull_request' }}
            with:
                file-path: comment.md
                comment-tag: coverage-comment
          - name: Upload HTML report if check failed.
            uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
            if: ${{ failure() }}
            with:
                name: html-report
                path: htmlcov
